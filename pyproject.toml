[build-system]
# 下限 70.1：setuptools 从 70.1 起内置 bdist_wheel，构建时不再需要单独安装 wheel 包。
# 更早的版本（61~70.0）在没装 wheel 的环境里会以
# 「error: invalid command 'bdist_wheel'」失败。70.x 仍支持 Python 3.8。
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-toolkit"
version = "2.0.0"
description = "基金全栈数据工具包：搜索/净值/持仓/评分/筛选/相关性/定投回测/可视化，零第三方依赖"
readme = "README.md"
requires-python = ">=3.8"
# 许可证用老式 table 写法，不要改成 license = "MIT"：
#   SPDX 表达式（PEP 639）需要 setuptools >= 77，而 setuptools 77 起要求 Python >= 3.9，
#   因此 Python 3.8 上永远装不到能解析它的 setuptools，构建会以
#   「invalid pyproject.toml config: `project.license`」失败。
#   实测 { text = "MIT" } 在 setuptools 75.3.0（3.8 上可用的最新版）和 84.0.0 上都能正常构建。
license = { text = "MIT" }
authors = [{ name = "NOX-1354", email = "nora1226even@163.com" }]
keywords = ["fund", "finance", "investment", "基金", "投资", "定投", "skill"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
# 注意：不要再加 `License :: OSI Approved :: MIT License` 分类器——
# 它与 license 字段重复，新版 setuptools 会直接报 InvalidConfigError 拒绝构建。

# ★ 零第三方依赖：只用 Python 标准库。请不要在这里添加任何东西。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/nox-1354/fund-toolkit"
Repository = "https://github.com/nox-1354/fund-toolkit"
Issues = "https://github.com/nox-1354/fund-toolkit/issues"

# 单模块分发：实现就在 skill 目录里，不另存副本（因此不可能出现两份代码漂移）
[tool.setuptools]
py-modules = ["fund_skill"]
package-dir = { "" = "skills/fund-toolkit/scripts" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: 需要联网的冒烟测试（CI 中不阻塞）",
]
