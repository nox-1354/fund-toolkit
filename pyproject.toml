[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-toolkit"
version = "2.0.0"
description = "基金全栈数据工具包：搜索/净值/持仓/评分/筛选/相关性/定投回测/可视化，零第三方依赖"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "NOX-1354", email = "nora1226even@163.com" }]
keywords = ["fund", "finance", "investment", "基金", "投资", "定投", "skill"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
# 注意：不要再加 "License :: OSI Approved :: MIT License" 分类器。
# PEP 639 起许可证用上面的 license 表达式表示，二者同时出现会被 setuptools 直接拒绝：
#   InvalidConfigError: License classifiers have been superseded by license expressions

# ★ 零第三方依赖：只用 Python 标准库。请不要在这里添加任何东西。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/nox-1354/fund-toolkit"
Repository = "https://github.com/nox-1354/fund-toolkit"
Issues = "https://github.com/nox-1354/fund-toolkit/issues"

# 单模块分发：实现就在 skill 目录里，不另存副本（因此不可能出现两份代码漂移）
[tool.setuptools]
py-modules = ["fund_skill"]
package-dir = { "" = "skills/fund-toolkit/scripts" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: 需要联网的冒烟测试（CI 中不阻塞）",
]
