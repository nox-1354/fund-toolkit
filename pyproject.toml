[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-toolkit"
version = "1.3.0"
description = "基金全栈数据工具包 - 搜索/净值/评分/定投/可视化"
readme = "README.md"
authors = [
    {name = "NOX-1354", email = "nora1226even@163.com"},
]
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["fund", "finance", "investment", "基金", "投资", "定投"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.11.0",
]

[project.optional-dependencies]
full = ["akshare>=1.12.0"]

[project.urls]
Homepage = "https://github.com/nox-1354/fund-toolkit"
Repository = "https://github.com/nox-1354/fund-toolkit"
Issues = "https://github.com/nox-1354/fund-toolkit/issues"

[tool.setuptools]
packages = ["fund_toolkit"]
